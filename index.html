function exportAccounting(){
  const p = val("f-period");
  if(!p){ notify("กรุณาเลือกเดือน"); return; }
  const tag = "แฟ้มบัญชี-" + beMonth(p) + "-";

  csvDownload(tag + "รายรับรายจ่าย.csv",
    [["วันที่","ทิศทาง","ยอด","รายละเอียด"]].concat(
      db.money.filter(m=>monthOf(m.date)===p).map(m=>[m.date, m.dir, m.amount, m.note||""])));

  csvDownload(tag + "งานรถ.csv",
    [["วันที่","ทะเบียน","รถ","ลูกค้า","โปรแกรม","Set","ยอด"]].concat(
      db.jobs.filter(j=>monthOf(j.date)===p).map(j=>[j.date, j.plate||"", j.carModel||"", j.customer||"", j.program||"", j.filmSet||"", j.amount])));

  const closed = db.payrolls.find(x=>x.period===p && x.closed);
  if(closed)
    csvDownload(tag + "เงินเดือน.csv",
      [["ชื่อ","ฐาน","ค่าบ้าน","ค่าคอม","OT ธรรมดา","OT วันหยุด","หัก ปกส.","หักเบิก","สุทธิ"]].concat(
        closed.lines.map(l=>[l.name, l.base, l.house||0, (l.comm||0).toFixed(2),
          (l.otNPay||0).toFixed(2), (l.otHPay||0).toFixed(2), l.sso, l.advance||0, l.net.toFixed(2)])));

  closeModal();
}

    + '<span class="sub">'+Math.round(body.length/1024)+' KB · พนักงาน '+db.staff.length+' · งานรถ '+db.jobs.length+' · เช็คชื่อ '+db.attendance.length+'</span></div>');
}
function copyTextExport(){
  const el = document.getElementById("tx-out");
  el.select(); el.setSelectionRange(0, 99999999);
  try{ document.execCommand("copy"); notify("ก๊อปแล้ว — เอาไปวางในหน้าใหม่ได้เลย"); }
  catch(e){ notify("ก๊อปอัตโนมัติไม่ได้ — กด Cmd+C เองหลังเลือกข้อความ"); }
}
function openTextImport(){
  openModal("วางข้อความกู้คืนข้อมูล",
    '<div class="note">⚠️ วางแล้วกดกู้คืน ข้อมูลปัจจุบันในเครื่องนี้จะถูกทับทั้งหมด</div>'
    + '<textarea class="inp" id="tx-in" style="height:180px;font-size:11px" placeholder="วางข้อความที่ก๊อปมาที่นี่"></textarea>'
    + mfoot("runTextImport", "", "กู้คืนจากข้อความ"));
}
function runTextImport(){
  let d;
  try{ d = JSON.parse(document.getElementById("tx-in").value.trim()); }
  catch(e){ notify("ข้อความไม่ใช่ข้อมูลสำรองของระบบนี้ (วางไม่ครบ?)"); return; }
  if(!d || !Array.isArray(d.staff) || !Array.isArray(d.jobs) || !d.settings){ notify("โครงข้อมูลไม่ถูกต้อง"); return; }
  appConfirm("กู้คืน: พนักงาน "+d.staff.length+" คน · งานรถ "+d.jobs.length+" คัน · เช็คชื่อ "+(d.attendance||[]).length+" รายการ\nทับข้อมูลเครื่องนี้ทั้งหมด?", ()=>{
    db = Object.assign(JSON.parse(JSON.stringify(DB_DEF)), d);
    save(); closeModal(); render();
    notify("กู้คืนเรียบร้อย" + (sbSession ? " — กำลังซิงค์ขึ้น cloud" : ""));
  }, "กู้คืนทับ");
}
function backupDb(){
  const body = JSON.stringify(db);
  const blob = new Blob([body], { type:"application/json" });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "albatros-erp-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function openRestore(){
  openModal("กู้คืนข้อมูลจากไฟล์สำรอง",
    '<div class="note">⚠️ กู้คืนแล้ว ข้อมูลปัจจุบันในเครื่องนี้จะถูก<b>ทับทั้งหมด</b> — สำรองของปัจจุบันก่อนถ้าไม่แน่ใจ</div>'
    + fld("ไฟล์สำรอง (.json)", '<input class="inp" type="file" accept=".json,application/json" id="f-restore">')
    + mfoot("runRestore", "", "กู้คืน"));
}
function runRestore(){
  const el = document.getElementById("f-restore");
  if(!el.files.length){ notify("เลือกไฟล์สำรองก่อนครับ"); return; }
  const rd = new FileReader();
  rd.onload = function(){
    let d;
    try { d = JSON.parse(String(rd.result)); }
    catch(e){ notify("อ่านไฟล์ไม่ได้ — ไม่ใช่ไฟล์สำรองของระบบนี้"); return; }
    if(!d || !Array.isArray(d.staff) || !Array.isArray(d.jobs) || !d.settings){
      notify("โครงไฟล์ไม่ใช่ข้อมูลสำรองของ Albatros ERP"); return;
    }
    appConfirm("กู้คืนข้อมูล: พนักงาน "+d.staff.length+" คน · งานรถ "+d.jobs.length+" คัน · เช็คชื่อ "+(d.attendance||[]).length+" รายการ\nทับข้อมูลปัจจุบันทั้งหมด ยืนยันไหม?", ()=>{
      db = Object.assign(JSON.parse(JSON.stringify(DB_DEF)), d);
      save(); closeModal(); render();
      notify("กู้คืนเรียบร้อยครับ");
    }, "กู้คืนทับ");
  };
  rd.readAsText(el.files[0], "utf-8");
}
function saveSettings(){
  const s = db.settings, r = s.rates;
  s.branch = val("s-branch").trim() || s.branch;
  r.pool["Ceramic+"] = +val("s-p-ceramic")||0;
  r.pool["Graphene"] = +val("s-p-graphene")||0;
  r.pool["SuperResin"] = +val("s-p-resin")||0;
  r.pool["ฟิล์มเต็มคัน"] = +val("s-p-film")||0;
  r.special["ฟิล์มเต็มคัน"] = +val("s-s-film")||0;
  r.special["SetA"] = +val("s-s-a")||0;
  r.special["SetB"] = +val("s-s-b")||0;
  r.special["SetC"] = +val("s-s-c")||0;
  r.special["ผิวส้ม"] = +val("s-s-orange")||0;
  // สัดส่วนที่แก้ = ของงวดปัจจุบัน (shareChanges ตัวล่าสุด) — ฐาน 40/60 ของเดือนเก่าห้ามแตะ
  if(!r.shareChanges || !r.shareChanges.length) r.shareChanges = [{ from:"2026-08", techShare:0.30, asstShare:0.70 }];
  const last = r.shareChanges[r.shareChanges.length-1];
  last.techShare = +val("s-tech")||0;
  last.asstShare = +val("s-asst")||0;
  r.percentRate = +val("s-pct")||0;
  s.ssoRate = +val("s-sso")||0;
  s.ssoCap = +val("s-ssocap")||0;
  s.otMult = +val("s-ot")||0;
  s.otHolidayMult = +val("s-oth")||0;
  save(); render();
  notify("บันทึกตั้งค่าแล้ว — งวดที่ปิดแล้วไม่กระทบ");
}
registerModule({ key:"settings", ic:"⚙️", label:"ตั้งค่า", render: renderSettings });

/* ============================================================
   แดชบอร์ด — KPI คำนวณสดทุกครั้ง
   ============================================================ */
function renderDash(){
  const p = curMonth();
  const dates = monthDates(p);
  const days = dates.map(dayCommission);
  const sales = days.reduce((t,d)=>t+d.sales,0);
  const active = db.staff.filter(st=>st.status!=="inactive");
  const commTotal = active.reduce((t,st)=> t + days.reduce((x,dc)=>x+staffDayComm(st,dc),0), 0);
  const advPaid = db.advances.filter(a=>a.status==="paid" && monthOf(a.paid_at||a.requested_at)===p)
    .reduce((t,a)=>t+(+a.amount||0),0);
  const cashIn  = db.money.filter(m=>m.dir==="เข้า" && monthOf(m.date)===p).reduce((t,m)=>t+(+m.amount||0),0);
  const cashOut = db.money.filter(m=>m.dir==="ออก" && monthOf(m.date)===p).reduce((t,m)=>t+(+m.amount||0),0);
  const todayPresent = Object.keys(presentIds(todayStr())).length;
  return head("แดชบอร์ด", "Albatros สาขา" + db.settings.branch + " · ภาพรวมเดือน " + beMonth(p), "")
    + '<div class="kpis">'
    + '<div class="kpi"><span class="lbl">ยอดขายเดือนนี้ (งานรถ)</span><b>'+baht(sales)+'</b></div>'
    + '<div class="kpi"><span class="lbl">ค่าคอมสะสมเดือนนี้</span><b>'+baht(commTotal)+'</b></div>'
    + '<div class="kpi"><span class="lbl">เบิกโอนแล้วเดือนนี้</span><b>'+baht(advPaid)+'</b></div>'
    + '<div class="kpi"><span class="lbl">มาทำงานวันนี้</span><b>'+todayPresent+' คน</b></div></div>'
    + '<div class="big">เงินสดเดือนนี้ เข้า '+boldAmt(cashIn)+' ออก '+boldAmt(cashOut)
    + ' — เปลี่ยนสุทธิ '+boldAmt(cashIn-cashOut)+'</div>';
}
registerModule({ key:"dash", ic:"📊", label:"แดชบอร์ด", render: renderDash });

render();
cloudBoot();   // มี session → ดึง cloud · ไม่มี → เด้งหน้าล็อกอิน (ปิดได้ = ออฟไลน์) · หน้า artifact (เน็ตถูกบล็อก) → ออฟไลน์เงียบๆ
</script>
</body>
