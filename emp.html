<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Albatros — หน้าพนักงาน</title>
<style>
/* ภาษาภาพเดียวกับ Albatros ERP */
:root{
  --bg:#f4f6f8; --card:#ffffff; --line:#e3e8ee; --ink:#1f2937; --dim:#6b7280;
  --brand:#0f766e; --brand-soft:#e6f4f1; --danger:#b91c1c; --danger-soft:#fdeaea;
  --new:#92400e; --new-soft:#fef3c7; --done:#065f46; --done-soft:#d1fae5;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
  font-size:15px;line-height:1.55;max-width:560px;margin:0 auto;padding:14px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.brand{font-weight:700;font-size:18px;color:var(--brand)}
.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0 12px}
.tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 4px;text-align:center;font-weight:600;font-size:14px;color:var(--dim)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;margin-bottom:14px}
.pad{padding:14px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--bg);color:var(--dim);font-weight:600;font-size:12.5px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--radius);
  padding:12px 15px;font-weight:600;width:100%;font-size:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.out{background:#334155}
.btn[disabled]{opacity:.5}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ใหม่{background:var(--new-soft);color:var(--new)}
.c-รอโอน{background:#dbeafe;color:#1e40af}
.c-เสร็จ{background:var(--done-soft);color:var(--done)}
.c-ปัด{background:var(--danger-soft);color:var(--danger)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1 1 130px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .lbl{font-size:12px;color:var(--dim)}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;display:block}
.kpi.hot b{color:var(--brand)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:30px 16px;text-align:center;color:var(--dim);margin-bottom:14px}
.lbl{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.inp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.fld{margin-bottom:12px}
.note{background:var(--brand-soft);color:var(--brand);border-radius:var(--radius);
  padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.warn{background:var(--new-soft);color:var(--new);border-radius:var(--radius);
  padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.meta{font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
  display:none;z-index:60;max-width:90%;text-align:center}
.shot{width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:10px}
.slip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.slip h3{font-size:16px;margin-bottom:2px}
.slip table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.slip td{padding:7px 2px;border-bottom:1px solid var(--line)}
.slip td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.slip tr.tot td{font-weight:700;font-size:16px;border-bottom:0;color:var(--brand)}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;
  align-items:center;justify-content:center;padding:18px;z-index:50}
.mbox{background:var(--card);border-radius:var(--radius);width:100%;max-width:420px;
  max-height:90vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.mbody{padding:16px;overflow:auto}
.lnk{background:none;border:0;padding:2px 6px;color:var(--brand);font-size:13.5px}
</style>
</head>
<body>
<div class="brand">🚗 Albatros — หน้าพนักงาน</div>
<div class="sub" id="who">กำลังตรวจกุญแจ…</div>
<div class="tabs" id="tabs" style="display:none">
  <button class="tab on" data-t="ck" onclick="go('ck')">⏱ ลงเวลา</button>
  <button class="tab" data-t="adv" onclick="go('adv')">💸 เบิกเงิน</button>
  <button class="tab" data-t="slip" onclick="go('slip')">📄 สลิป</button>
</div>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ═══ หน้าพนักงาน Albatros — ท่อตรง Supabase (ไม่มี GAS คั่น ไม่มีหน่วง) ═══
   ตัวตน = กุญแจส่วนตัวใน ?k= (ได้จากพิมพ์ "ผูกไลน์" ในไลน์ร้าน)
   ทุกคำสั่งผ่าน RPC emp_* ฝั่งเซิร์ฟเวอร์ตรวจกุญแจ + เห็นเฉพาะของตัวเอง */
const SB = "https://hcnyqlskwzbjgroyzjjx.supabase.co";
const SB_KEY = "sb_publishable_XBpPT8yrgzQeEm0hskFNmQ_tc2MoCsl";
const K = new URLSearchParams(location.search).get("k") || "";
const ADV_LIMIT_MONTH = 3000;

const TH_MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function baht(n){return (+n||0).toLocaleString("th-TH");}
function thDate(s){if(!s)return "—";const p=String(s).slice(0,10).split("-");return (+p[2])+" "+TH_MON[+p[1]-1]+" "+(+p[0]+543);}
function thMonth(p){const a=String(p).split("-");return TH_MON[+a[1]-1]+" "+(+a[0]+543);}
function monthOf(d){return String(d||"").slice(0,7);}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.style.display="block";
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2600);}
function openModal(t,html){document.getElementById("modal").innerHTML=
  '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="mbox">'
  +'<div class="mhead"><span>'+esc(t)+'</span><button class="lnk" onclick="closeModal()">✕</button></div>'
  +'<div class="mbody">'+html+'</div></div></div>';}
function closeModal(){document.getElementById("modal").innerHTML="";}

async function rpc(fn, args){
  const r = await fetch(SB+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY },
    body: JSON.stringify(args||{})
  });
  if(!r.ok) throw new Error("server "+r.status);
  return r.json();
}

let CTX = null, TAB = "ck";
const STATUS={pending:["รออนุมัติ","c-ใหม่"],approved:["รอโอน","c-รอโอน"],paid:["โอนแล้ว","c-เสร็จ"],rejected:["ปฏิเสธ","c-ปัด"]};
function chip(st){const s=STATUS[st]||[st,""];return '<span class="chip '+s[1]+'">'+s[0]+'</span>';}

async function boot(){
  if(!K){ fail("ไม่พบกุญแจในลิงก์"); return; }
  try{ CTX = await rpc("emp_ctx",{p_k:K}); }
  catch(e){ fail("ต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง"); return; }
  if(!CTX || !CTX.ok){ fail("กุญแจไม่ถูกต้องหรือถูกยกเลิก"); return; }
  document.getElementById("who").textContent = "สวัสดี "+CTX.name+" · "+(CTX.role||"");
  document.getElementById("tabs").style.display = "flex";
  const t = new URLSearchParams(location.search).get("t");
  go(t==="adv"||t==="slip"?t:"ck");
}
function fail(msg){
  document.getElementById("who").textContent = "—";
  document.getElementById("app").innerHTML =
    '<div class="empty">'+esc(msg)+'<br><br>เปิดแชทไลน์ร้าน แล้วพิมพ์ <b>ผูกไลน์</b> เพื่อรับลิงก์ใหม่ครับ</div>';
}
function go(t){
  TAB=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="ck") renderCheckin();
  else if(t==="adv") renderAdv();
  else renderSlips();
}

/* ── ⏱ ลงเวลา: ถ่ายรูปสด + ลายน้ำ + GPS ── */
let photoData="", gpsLat="", gpsLng="";
function renderCheckin(){
  const app=document.getElementById("app");
  const tIn=CTX.timeIn||"", tOut=CTX.timeOut||"";
  let h='<div class="note">วันนี้ '+thDate(CTX.today)
    +(tIn?' · เข้า '+tIn:'')+(tOut?' · ออก '+tOut:'')+'</div>';
  h+='<div class="card pad">'
    +'<label class="lbl">ถ่ายรูปยืนยันตัว (บังคับ — กล้องสดเท่านั้น)</label>'
    +'<img id="shot" class="shot" style="display:none">'
    +'<input type="file" id="cam" accept="image/*" capture="user" style="display:none" onchange="gotPhoto(this)">'
    +'<button class="btn ghost" style="margin-bottom:10px" onclick="document.getElementById(\'cam\').click()">📷 ถ่ายรูป</button>'
    +'<div id="gps" class="meta" style="margin-bottom:10px">📍 กำลังขอพิกัด… (ไม่ให้ก็ลงเวลาได้ แต่ระบบติดธงไว้)</div>'
    +(tIn===""
      ? '<button class="btn" id="btn-in" onclick="doCheckin(\'IN\')" disabled>ลงเวลา เข้างาน</button>'
      : (tOut===""
        ? '<button class="btn out" id="btn-out" onclick="doCheckin(\'OUT\')" disabled>ลงเวลา เลิกงาน</button>'
        : '<div class="empty" style="margin:0">วันนี้ลงเวลาครบแล้ว ✓<br>เข้า '+tIn+' · ออก '+tOut+'</div>'))
    +'</div>'
    +'<div class="meta" style="text-align:center">รูป+เวลาบันทึกเข้าระบบร้านทันที ไม่ต้องรอใครกดรับ</div>';
  app.innerHTML=h;
  askGps();
}
function askGps(){
  if(!navigator.geolocation){document.getElementById("gps").textContent="📍 เครื่องนี้ไม่มี GPS";return;}
  navigator.geolocation.getCurrentPosition(p=>{
    gpsLat=String(p.coords.latitude.toFixed(6)); gpsLng=String(p.coords.longitude.toFixed(6));
    const el=document.getElementById("gps"); if(el) el.textContent="📍 ได้พิกัดแล้ว ✓";
  },()=>{ const el=document.getElementById("gps"); if(el) el.textContent="📍 ไม่ได้พิกัด (ติดธงไว้)"; },{timeout:8000});
}
function gotPhoto(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    const w=400, h=Math.round(img.height*w/img.width);   // 400px พอเห็นหน้าชัด · เก็บ 900+ ใบ/เดือน ต้องคุมขนาด
    c.width=w; c.height=h;
    const x=c.getContext("2d");
    x.drawImage(img,0,0,w,h);
    // ลายน้ำ ชื่อ+เวลา กันรูปเก่า/รูปแทนกัน
    const now=new Date(), pad=n=>String(n).padStart(2,"0");
    const stamp=CTX.name+" · "+pad(now.getDate())+"/"+pad(now.getMonth()+1)+" "+pad(now.getHours())+":"+pad(now.getMinutes());
    x.fillStyle="rgba(0,0,0,.55)"; x.fillRect(0,h-30,w,30);
    x.fillStyle="#fff"; x.font="15px sans-serif"; x.fillText(stamp,10,h-10);
    photoData=c.toDataURL("image/jpeg",0.5);
    const el=document.getElementById("shot"); el.src=photoData; el.style.display="block";
    const b=document.getElementById("btn-in")||document.getElementById("btn-out");
    if(b) b.disabled=false;
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
}
async function doCheckin(slot){
  const b=document.getElementById(slot==="IN"?"btn-in":"btn-out");
  if(!photoData){toast("ถ่ายรูปก่อนครับ");return;}
  b.disabled=true; b.textContent="กำลังบันทึก…";
  try{
    const r=await rpc("emp_checkin",{p_k:K,p_slot:slot,p_lat:gpsLat,p_lng:gpsLng,p_photo:photoData});
    if(!r.ok){toast(r.message||"บันทึกไม่สำเร็จ");b.disabled=false;b.textContent=slot==="IN"?"ลงเวลา เข้างาน":"ลงเวลา เลิกงาน";return;}
    toast(r.duplicated?r.message:("บันทึก"+(slot==="IN"?"เข้างาน":"เลิกงาน")+" "+r.time+" แล้ว ✓"));
    photoData="";
    CTX=await rpc("emp_ctx",{p_k:K});
    renderCheckin();
  }catch(e){toast("ต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่");b.disabled=false;}
}

/* ── 💸 เบิกเงิน ── */
async function renderAdv(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="empty">กำลังโหลด…</div>';
  let r; try{ r=await rpc("emp_my_advances",{p_k:K}); }catch(e){ app.innerHTML='<div class="empty">โหลดไม่ได้ ลองใหม่</div>'; return; }
  const rows=(r.rows||[]);
  const p=CTX.today.slice(0,7);
  const com=rows.filter(a=>monthOf(a.requested_at)===p&&(a.status==="approved"||a.status==="paid"))
    .reduce((t,a)=>t+(+a.amount||0),0);
  const pend=rows.filter(a=>monthOf(a.requested_at)===p&&a.status==="pending")
    .reduce((t,a)=>t+(+a.amount||0),0);
  let h='<div class="kpis">'
    +'<div class="kpi hot"><span class="lbl">เบิกแล้วเดือนนี้</span><b>'+baht(com)+' ฿</b>'
    +'<span class="meta">เพดานเตือน '+baht(ADV_LIMIT_MONTH)+' ฿</span></div>'
    +'<div class="kpi"><span class="lbl">รออนุมัติ</span><b>'+baht(pend)+' ฿</b></div></div>'
    +'<button class="btn" style="margin-bottom:14px" onclick="openAdvForm('+com+')">+ ยื่นเบิกเงิน</button>';
  if(!rows.length) h+='<div class="empty">ยังไม่เคยเบิก</div>';
  else h+='<div class="card"><table class="tbl"><thead><tr><th>วันที่</th><th class="num">ยอด</th><th>เหตุผล</th><th>สถานะ</th></tr></thead><tbody>'
    +rows.map(a=>'<tr><td>'+thDate(a.requested_at)+'</td><td class="num"><b>'+baht(a.amount)+'</b></td>'
      +'<td>'+esc(a.reason||"—")+'</td><td>'+chip(a.status)
      +(a.status==="paid"&&a.slip_data?' <button class="lnk" onclick="viewAdvSlip(\''+a.id+'\')">สลิป</button>':'')
      +'</td></tr>').join('')
    +'</tbody></table></div>';
  h+='<div class="meta" style="text-align:center">ยอดที่โอนแล้วจะถูกหักจากเงินเดือนเดือนนั้นอัตโนมัติ</div>';
  app.innerHTML=h;
  window.__advRows=rows;
}
function openAdvForm(com){
  openModal("ยื่นเบิกเงิน — "+CTX.name,
    '<div class="fld"><label class="lbl">จำนวนเงิน (บาท)</label>'
    +'<input class="inp" id="f-amt" type="number" inputmode="numeric" placeholder="เช่น 500"></div>'
    +'<div class="fld"><label class="lbl">เหตุผล (ไม่ใส่ก็ได้)</label>'
    +'<input class="inp" id="f-why" placeholder="เช่น ค่าน้ำมัน"></div>'
    +'<div class="meta">เดือนนี้เบิกไปแล้ว '+baht(com)+' ฿ · เพดานเตือน '+baht(ADV_LIMIT_MONTH)+' ฿ (พี่โอเป็นคนตัดสิน)</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
    +'<button class="btn ghost" style="width:auto" onclick="closeModal()">ยกเลิก</button>'
    +'<button class="btn" style="width:auto" id="f-go" onclick="submitAdv()">ยื่นเบิก</button></div>');
}
async function submitAdv(){
  const amt=+document.getElementById("f-amt").value;
  const why=document.getElementById("f-why").value.trim();
  if(!amt||amt<=0){toast("ใส่จำนวนเงินก่อนครับ");return;}
  const b=document.getElementById("f-go"); b.disabled=true; b.textContent="กำลังส่ง…";
  try{
    const r=await rpc("emp_adv_submit",{p_k:K,p_amount:amt,p_reason:why});
    if(!r.ok){toast("ส่งไม่สำเร็จ");b.disabled=false;b.textContent="ยื่นเบิก";return;}
    closeModal(); toast("ยื่นเบิก "+baht(amt)+" ฿ แล้ว — รอพี่โออนุมัติ");
    renderAdv();
  }catch(e){toast("ต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่");b.disabled=false;b.textContent="ยื่นเบิก";}
}
function viewAdvSlip(id){
  const a=(window.__advRows||[]).find(x=>x.id===id);
  if(!a||!a.slip_data) return;
  openModal("สลิปโอน — "+baht(a.amount)+" ฿",
    '<img src="'+a.slip_data+'" style="width:100%;border-radius:8px">');
}

/* ── 📄 สลิปเงินเดือน: เลือกงวดเอง เฉพาะงวดที่ปิดแล้ว ── */
async function renderSlips(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="empty">กำลังโหลด…</div>';
  let r; try{ r=await rpc("emp_payslips",{p_k:K}); }catch(e){ app.innerHTML='<div class="empty">โหลดไม่ได้ ลองใหม่</div>'; return; }
  const slips=r.slips||[];
  if(!slips.length){ app.innerHTML='<div class="empty">ยังไม่มีสลิป — งวดเงินเดือนยังไม่ปิด<br>ปิดงวดเมื่อไหร่ สลิปจะขึ้นที่นี่เอง</div>'; return; }
  window.__slips=slips;
  let h='<div class="fld"><label class="lbl">เลือกงวดเดือน</label>'
    +'<select class="inp" id="slip-sel" onchange="showSlip(this.value)">'
    +slips.map((s,i)=>'<option value="'+i+'">'+thMonth(s.period)+'</option>').join('')
    +'</select></div><div id="slip-box"></div>';
  app.innerHTML=h;
  showSlip(0);
}
function showSlip(i){
  const s=window.__slips[+i]; if(!s) return;
  const l=s.line||{};
  const row=(k,v)=>'<tr><td>'+k+'</td><td>'+v+'</td></tr>';
  document.getElementById("slip-box").innerHTML=
    '<div class="slip"><h3>สลิปเงินเดือน · '+thMonth(s.period)+'</h3>'
    +'<div class="meta">'+esc(l.name||CTX.name)+' · ปิดงวด '+thDate(s.closedAt)+'</div>'
    +'<table>'
    +row("เงินเดือนฐาน",baht(l.base)+" ฿")
    +row("ค่าบ้าน",baht(l.house||0)+" ฿")
    +row("ค่าคอมมิชชั่น",baht(l.comm||0)+" ฿")
    +row("OT ธรรมดา ("+(+l.otNHours||0).toFixed(1)+" ชม. × "+(s.otMult||"1.5")+")",baht(l.otNPay||0)+" ฿")
    +row("OT วันหยุด ("+(+l.otHHours||0).toFixed(1)+" ชม. × "+(s.otHolidayMult||"2")+")",baht(l.otHPay||0)+" ฿")
